apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-chronicler
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cluster-chronicler
  template:
    metadata:
      labels:
        app: cluster-chronicler
    spec:
      serviceAccountName: cluster-chronicler
      containers:
      - name: chronicler
        image: jhevans28/cluster-chronicler:latest
        imagePullPolicy: Always
        resources:
          limits:
            cpu: "200m"
            memory: "128Mi"
          requests:
            cpu: "100m"
            memory: "64Mi"
