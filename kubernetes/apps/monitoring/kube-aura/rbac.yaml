apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-aura
  namespace: monitoring
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-aura-read-all
rules:
  # Core API: Needed to list pods and events across all namespaces
  - apiGroups: [""]
    resources: ["pods", "events", "namespaces"]
    verbs: ["get", "list", "watch"]
  # Metrics API: Needed for real-time CPU/Memory usage metrics
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-aura-read-all-binding
subjects:
  - kind: ServiceAccount
    name: kube-aura
    namespace: monitoring
roleRef:
  kind: ClusterRole
  name: kube-aura-read-all
  apiGroup: rbac.authorization.k8s.io
