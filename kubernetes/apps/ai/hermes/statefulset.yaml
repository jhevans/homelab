apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hermes
  namespace: ai
spec:
  serviceName: hermes
  replicas: 1
  selector:
    matchLabels:
      app: hermes
  template:
    metadata:
      labels:
        app: hermes
    spec:
      serviceAccountName: hermes
      securityContext:
        fsGroup: 10000
      containers:
        - name: hermes
          image: nousresearch/hermes-agent:main
          imagePullPolicy: Always
          args: ["gateway", "run"]
          tty: true
          stdin: true
          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GOOGLE_API_KEY
            - name: PROVIDER
              value: "google"
            - name: MODEL
              value: "gemini-1.5-pro"
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: TELEGRAM_ALLOWED_USERS
            - name: GATEWAY_ALLOW_ALL_USERS
              value: "false"
            - name: DOCKER_HOST
              value: tcp://localhost:2375
          volumeMounts:
            - name: data
              mountPath: /opt/data
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
            requests:
              cpu: "500m"
              memory: "512Mi"

        - name: dashboard
          image: nousresearch/hermes-agent:main
          imagePullPolicy: Always
          args: ["dashboard", "--host", "0.0.0.0", "--port", "9119", "--insecure", "--no-open"]
          env:
            - name: GOOGLE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: GOOGLE_API_KEY
          volumeMounts:
            - name: data
              mountPath: /opt/data
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"

        # The Sandbox: Docker-in-Docker sidecar
        - name: sandbox
          image: docker:dind
          securityContext:
            privileged: true # Required for DIND
          env:
            - name: DOCKER_TLS_CERTDIR
              value: "" # Disable TLS for local sidecar communication
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-data
