apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hermes
  namespace: ai
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: auth-authelia@kubernetescrd
spec:
  rules:
  - host: hermes.lab.local
    http:
      paths:
      - backend:
          service:
            name: hermes
            port:
              number: 9119
        path: /
        pathType: Prefix
