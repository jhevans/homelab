apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-chronicler
  namespace: ai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-chronicler-role
rules:
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-chronicler-binding
subjects:
- kind: ServiceAccount
  name: cluster-chronicler
  namespace: ai
roleRef:
  kind: ClusterRole
  name: cluster-chronicler-role
  apiGroup: rbac.authorization.k8s.io
