apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgejo-runner
  namespace: development
  labels:
    app: forgejo-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app: forgejo-runner
  template:
    metadata:
      labels:
        app: forgejo-runner
    spec:
      containers:
        - name: runner
          image: data.forgejo.org/forgejo/runner:3.3.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              until [ -S /var/run/docker.sock ]; do
                echo "Waiting for docker socket..."
                sleep 2
              done
              if [ ! -f /data/.runner ] && [ ! -f .runner ]; then
                echo "Registering runner..."
                /bin/forgejo-runner register \
                  --instance "$GITEA_INSTANCE_URL" \
                  --token "$GITEA_RUNNER_REGISTRATION_TOKEN" \
                  --name "$GITEA_RUNNER_NAME" \
                  --labels "$GITEA_RUNNER_LABELS" \
                  --no-interactive
              fi
              echo "Starting daemon..."
              exec /bin/forgejo-runner daemon
          env:
            - name: GITEA_INSTANCE_URL
              value: "http://forgejo.development.svc.cluster.local:3000"
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: forgejo-runner-secret
                  key: token
            - name: GITEA_RUNNER_NAME
              value: "k3s-act-runner"
            - name: GITEA_RUNNER_LABELS
              value: "ubuntu-latest:docker://node:20-alpine,ubuntu-22.04:docker://node:20-alpine,docker:docker://docker:dind"
            - name: DOCKER_HOST
              value: "unix:///var/run/docker.sock"
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: "200m"
              memory: 256Mi

        - name: dind
          image: docker:dind
          securityContext:
            privileged: true
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run
            - name: dind-storage
              mountPath: /var/lib/docker
          resources:
            limits:
              cpu: "2"
              memory: 2Gi
            requests:
              cpu: "500m"
              memory: 512Mi

      volumes:
        - name: docker-socket
          emptyDir: {}
        - name: dind-storage
          emptyDir: {}
