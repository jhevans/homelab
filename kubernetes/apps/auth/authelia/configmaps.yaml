apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-config
  namespace: auth
data:
  configuration.yaml: |
    # Authelia configuration.yaml
    server:
      address: 'tcp://0.0.0.0:9091/'

    log:
      level: 'info'

    authentication_backend:
      file:
        path: /config/users.yml

    session:
      name: authelia_session
      secret: "placeholder-secret" # Overridden by env var
      cookies:
        - domain: 'lab.local'
          authelia_url: 'http://auth.lab.local'
          default_redirection_url: 'http://lab.local'
          insecure: true

    storage:
      local:
        path: /config/db.sqlite3
      encryption_key: "placeholder-key" # Overridden by env var

    notifier:
      filesystem:
        filename: /config/notification.txt

    access_control:
      default_policy: one_factor

    identity_validation:
      reset_password:
        jwt_secret: "placeholder-jwt" # Overridden by env var
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authelia-users
  namespace: auth
data:
  users.yml: |
    users:
      john:
        displayname: "John"
        # Password is 'authelia'
        password: "$argon2id$v=19$m=65536,t=3,p=4$d3VzLg2+1r4jjLzV+temqQ$UGK/5hwA+iaXKKYZjdrqHgSxUPC8ZkDWfBWXCmsoSks"
        email: john@lab.local
        groups:
          - admins
