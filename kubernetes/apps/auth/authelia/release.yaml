apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: auth
spec:
  interval: 15m
  chart:
    spec:
      chart: authelia
      version: 0.11.5
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: auth
  values:
    
    configMap:
      disabled: false
      existingConfigMap: authelia-config
      key: configuration.yaml

    secret:
      disabled: true
      existingSecret: authelia-secrets

    pod:
      env:
        - name: AUTHELIA_CONFIG_FILTERS
          value: "template"
        - name: AUTHELIA_SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: authelia-secrets
              key: session_secret
        - name: AUTHELIA_STORAGE_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: authelia-secrets
              key: storage_encryption_key
        - name: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: authelia-secrets
              key: jwt_secret
      
      extraVolumes:
        - name: users-db
          configMap:
            name: authelia-users
      extraVolumeMounts:
        - name: users-db
          mountPath: /config/users.yml
          subPath: users.yml
          readOnly: true

    persistence:
      enabled: true
      size: 1Gi
      storageClass: local-path
    
    ingress:
      enabled: false
