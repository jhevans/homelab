apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: gpu-system
spec:
  interval: 1h
  chart:
    spec:
      chart: k8s-device-plugin
      version: 0.17.0
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: gpu-system
  install:
    createNamespace: true
  values:
    runtimeClassName: nvidia
