apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  chart:
    spec:
      chart: velero
      version: "7.2.2"
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: velero
  interval: 1h
  values:
    # 1. Integration with Cloudflare R2 (S3 Compatible)
    configuration:
      backupStorageLocation:
        - name: default
          provider: aws # R2 uses the AWS S3 provider logic
          bucket: homelab-backups
          config:
            region: auto
            s3ForcePathStyle: true
            s3Url: https://d65ccff32296861854013e208da2ed2a.r2.cloudflarestorage.com
      
      volumeSnapshotLocation: []
      
      # Enable automatic filesystem backups for all volumes
      defaultVolumesToFsBackup: true

    # 2. Disable native snapshots (using Kopia/node-agent instead)
    snapshotsEnabled: false

    # 3. Enable node-agent for file-level backups
    nodeAgent:
      enabled: true
      uploaderType: kopia

    # 4. Disable the upgrade job
    upgradeCRDs: false

    # 5. Credentials
    credentials:
      useSecret: true
      existingSecret: velero-r2-credentials

    # 6. Install necessary plugins
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.9.0
        volumeMounts:
          - mountPath: /target
            name: plugins
    
    # 7. Fix for broken kubectl image in chart defaults
    kubectl:
      image:
        repository: bitnami/kubectl
        tag: 1.34.0
