apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  chart:
    spec:
      chart: velero
      version: "7.2.2" # Upgrading from 7.1.0 to resolve VolumeSnapshotLocation validation bug
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: velero
  interval: 1h
  values:
    # 1. Integration with Cloudflare R2 (S3 Compatible)
    configuration:
      backupStorageLocation:
        - name: default
          provider: aws # R2 uses the AWS S3 provider logic
          bucket: homelab-backups
          config:
            region: auto
            s3ForcePathStyle: true
            s3Url: https://d65ccff32296861854013e208da2ed2a.r2.cloudflarestorage.com
      
      # Explicitly empty list to avoid auto-creation of invalid "default" location in chart 7.1.0+
      volumeSnapshotLocation: []

    # 2. Disable native snapshots (using Kopia/node-agent instead for local-path volumes)
    snapshotsEnabled: false

    # 3. Enable file-level backups (for local-path volumes)
    defaultVolumesToFsBackup: true
    nodeAgent:
      enabled: true
      uploaderType: kopia # Modern alternative to restic

    # 4. Disable the upgrade job (CRDs are managed manually or already present)
    upgradeCRDs: false

    # 5. Credentials
    credentials:
      useSecret: true
      existingSecret: velero-r2-credentials

    # 6. Install necessary plugins
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.9.0
        volumeMounts:
          - mountPath: /target
            name: plugins
    
    # 7. Fix for broken kubectl image in chart defaults (must have a shell)
    kubectl:
      image:
        repository: bitnami/kubectl
        tag: 1.34.0
